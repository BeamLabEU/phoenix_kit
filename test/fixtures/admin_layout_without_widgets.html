    var LIGHT = 'phoenix-light';
    var DARK = 'phoenix-dark';
    var BASES = {"corporate":"light","pastel":"light","abyss":"dark","retro":"light","nord":"dark","black":"dark","lemonade":"light","synthwave":"dark","night":"dark","business":"dark","lofi":"light","valentine":"light","autumn":"light","sunset":"dark","dark":"dark","aqua":"light","phoenix-dark":"dark","wireframe":"light","light":"light","coffee":"dark","dracula":"dark","phoenix-light":"light","bumblebee":"light","fantasy":"light","forest":"dark","cmyk":"light","cupcake":"light","luxury":"dark","acid":"light","garden":"light","winter":"light","silk":"light","emerald":"light","caramellatte":"light","cyberpunk":"light","dim":"dark","halloween":"dark"};

    function resolve(theme) {
      if (!theme || theme === 'system') {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? DARK
          : LIGHT;
      }
      return theme;
    }

    function apply(theme) {
      var resolved = resolve(theme);
      var el = document.documentElement;
      el.setAttribute('data-theme', resolved);
      el.style.colorScheme = BASES[resolved] || 'light';
    }

    var saved = null;
    try {
      saved = localStorage.getItem(KEY);
      // The deleted static phoenix_kit_themes.js wrote this older key.
      // Promote it once so an upgrade does not reset the saved choice.
      if (!saved) {
        var legacy = localStorage.getItem(LEGACY_KEY);
        if (legacy) {
          saved = legacy;
          localStorage.setItem(KEY, legacy);
        }
      }
    } catch (e) {
      /* storage blocked: fall through to system */
    }

    apply(saved);

    // A theme picked in another tab follows into this one.
    window.addEventListener('storage', function (e) {

<script>
  (function () {
    // One instance per page: a host root layout and the kit's own admin
    // shell can both render this.
    if (window.__pkSidebarCompact) return;
    window.__pkSidebarCompact = true;

    var KEY = "phoenix_kit:admin:sidebar:compact";

    function read() {
      try { return localStorage.getItem(KEY) === "1"; } catch (_e) { return false; }
    }

    function stamp(on) {
      var el = document.documentElement;
      if (on) { el.setAttribute("data-pk-sidebar", "compact"); }
      else { el.removeAttribute("data-pk-sidebar"); closeAll(); }
      syncButton(on);
    }

    // The button's own label has to follow the state it toggles, and the
    // button is re-rendered by every live navigation — so this runs on
    // stamp AND on the LiveView page-load event, not just once.
    function syncButton(on) {
      var btn = document.querySelector("[data-pk-sidebar-toggle]");
      if (!btn) return;
      var label = on ? btn.dataset.pkLabelExpand : btn.dataset.pkLabelCollapse;
      if (!label) return;
      btn.setAttribute("aria-label", label);
      btn.setAttribute("title", label);
      btn.setAttribute("aria-expanded", on ? "false" : "true");
    }

    // Pre-paint: this script sits above the sidebar markup, so the
    // attribute is on <html> before the menu is parsed. No flash.
    stamp(read());

    // Delegated: the sidebar DOM is replaced on every live navigation, so
    // a listener bound to the button itself would need re-binding and
    // cleanup. A document listener survives every patch.
    document.addEventListener("click", function (e) {
      var btn = e.target.closest && e.target.closest("[data-pk-sidebar-toggle]");
      if (!btn) return;
      var next = !read();
      try { localStorage.setItem(KEY, next ? "1" : "0"); } catch (_e) {}
      stamp(next);
    });

    // Re-apply after a live navigation swaps the button back in.
    window.addEventListener("phx:page-loading-stop", function () { syncButton(read()); });

    // Follow the choice into the app's other tabs, as the theme does.
    window.addEventListener("storage", function (e) {
      if (e.key === KEY) stamp(read());
    });

    // ── Flyouts ─────────────────────────────────────────────────────────
    //
    // Collapsed, a row shows an icon and nothing else, so every entry needs
    // somewhere to say its own name — and a section needs somewhere to
    // offer its children, which `subtab_display: :when_active` otherwise
    // renders only for the section you are already in.
    //
    // Every listener is delegated from `document`: the sidebar DOM is
    // replaced on every live navigation, so anything bound per-element
    // would need re-binding and teardown. `mouseover`/`focusin` bubble, and
    // a shown popover is still a DOM descendant of the row it belongs to —
    // the top layer changes painting, not the tree — so one listener covers
    // the trigger and its flyout together.
    var HOVER_IN = 120;   // hover intent: don't flash on a passing cursor
    var HOVER_OUT = 220;  // grace to travel from the icon to the panel
    var openTimer = null;
    var closeTimer = null;

    function compact() {
      return document.documentElement.getAttribute("data-pk-sidebar") === "compact";
    }

    function flyoutFor(node) {
      var row = node && node.closest && node.closest("[data-pk-flyout-id]");
      if (!row) return null;
      return document.getElementById(row.dataset.pkFlyoutId);
    }

    // Popovers paint in the top layer, which means they are positioned
    // against the VIEWPORT — the one thing the old CSS tooltip could not do
    // from inside the sidebar's own scroll container.
    function place(panel, row) {
      var r = row.getBoundingClientRect();
      panel.style.left = Math.round(r.right + 6) + "px";
      panel.style.top = Math.round(r.top) + "px";
      panel.style.bottom = "auto";
      // Clamp: a section near the bottom of a long menu would otherwise
      // open past the fold, where its last items are unreachable.
      var h = panel.offsetHeight;
      if (r.top + h > window.innerHeight - 8) {
        panel.style.top = Math.max(8, window.innerHeight - h - 8) + "px";
      }
    }

    function open(panel, row) {
      if (!panel || !panel.showPopover || panel.matches(":popover-open")) return;
      try {
        panel.showPopover();
      } catch (_e) {
        return;
      }
      place(panel, row);
    }

    function closeAll() {
      var open = document.querySelector(".pk-sidebar-flyout:popover-open");
      if (open && open.hidePopover) {
        try { open.hidePopover(); } catch (_e) {}
      }
    }

    document.addEventListener("mouseover", function (e) {
      if (!compact()) return;
      var row = e.target.closest && e.target.closest("[data-pk-flyout-id]");
      if (!row) return;
      clearTimeout(closeTimer);
      clearTimeout(openTimer);
      var panel = flyoutFor(row);
      if (!panel || panel.matches(":popover-open")) return;
      openTimer = setTimeout(function () { open(panel, row); }, HOVER_IN);
    });

    document.addEventListener("mouseout", function (e) {
      if (!compact()) return;
      if (!e.target.closest || !e.target.closest("[data-pk-flyout-id]")) return;
      // Moving deeper inside the same row (or into its panel) is not a
      // leave — `relatedTarget` is null only when the pointer left the
      // window entirely.
      var to = e.relatedTarget;
      if (to && to.closest && to.closest("[data-pk-flyout-id]") === e.target.closest("[data-pk-flyout-id]")) {
        return;
      }
      clearTimeout(openTimer);
      clearTimeout(closeTimer);
      closeTimer = setTimeout(closeAll, HOVER_OUT);
    });

    // Keyboard: tabbing onto a rail icon names it, and Tab then walks
    // straight into the panel because it sits next to the link in the DOM.
    // Esc and click-away are `popover=auto`'s own behaviour.
    document.addEventListener("focusin", function (e) {
      if (!compact()) return;
      var row = e.target.closest && e.target.closest("[data-pk-flyout-id]");
      if (!row) { closeAll(); return; }
      open(flyoutFor(row), row);
    });

    // Touch: there is no hover, so a tap on a rail icon opens its flyout
    // instead of navigating — otherwise a touch user on a wide screen
    // (a convertible laptop, a tablet in landscape; the rail is lg-only)
    // could never reach a subtab at all. The flyout's own links navigate
    // normally, and a second tap on the icon dismisses it.
    document.addEventListener("click", function (e) {
      if (!compact()) return;
      if (!window.matchMedia || !window.matchMedia("(hover: none)").matches) return;
      var link = e.target.closest && e.target.closest("[data-pk-flyout-id] > a");
      if (!link) return;
      var row = link.closest("[data-pk-flyout-id]");
      var panel = flyoutFor(row);
      if (!panel) return;
      e.preventDefault();
      if (panel.matches(":popover-open")) { closeAll(); } else { open(panel, row); }
    });

    // A live navigation replaces the sidebar under an open panel, and
    // expanding the rail makes flyouts meaningless.
    window.addEventListener("phx:page-loading-start", closeAll);
    window.addEventListener("resize", closeAll);
  })();

      link.addEventListener('click', () => {
        if (drawerToggle && window.innerWidth < 1024) {
          drawerToggle.checked = false;
        }
      });
    });

    // Handle burger menu toggle for desktop
    if (burgerMenuButton && adminDrawer) {
      burgerMenuButton.addEventListener('click', () => {
        // On desktop (>= 1024px), toggle the sidebar-closed class
        if (window.innerWidth >= 1024) {
          adminDrawer.classList.toggle('sidebar-closed');
        }
        // On mobile, default checkbox behavior handles it
      });
    }
  });
</script>

<script>
  (function () {
    // One instance per page, whichever layout renders first.
    if (window.__pkThemeController) return;
    window.__pkThemeController = true;

    const STORAGE_KEY = 'phx:theme';
    const themeBaseMap = {"corporate":"light","pastel":"light","abyss":"dark","retro":"light","nord":"dark","black":"dark","lemonade":"light","synthwave":"dark","night":"dark","business":"dark","lofi":"light","valentine":"light","autumn":"light","sunset":"dark","dark":"dark","aqua":"light","phoenix-dark":"dark","wireframe":"light","light":"light","coffee":"dark","dracula":"dark","phoenix-light":"light","bumblebee":"light","fantasy":"light","forest":"dark","cmyk":"light","cupcake":"light","luxury":"dark","acid":"light","garden":"light","winter":"light","silk":"light","emerald":"light","caramellatte":"light","cyberpunk":"light","dim":"dark","halloween":"dark"};
    const themeLabels = {"corporate":"Corporate","pastel":"Pastel","abyss":"Abyss","retro":"Retro","nord":"Nord","black":"Black","lemonade":"Lemonade","synthwave":"Synthwave","night":"Night","business":"Business","lofi":"Lo-Fi","valentine":"Valentine","autumn":"Autumn","sunset":"Sunset","dark":"Dark","aqua":"Aqua","phoenix-dark":"Phoenix Dark","wireframe":"Wireframe","light":"Light","coffee":"Coffee","dracula":"Dracula","phoenix-light":"Phoenix Light","bumblebee":"Bumblebee","fantasy":"Fantasy","forest":"Forest","system":"System","cmyk":"CMYK","cupcake":"Cupcake","luxury":"Luxury","acid":"Acid","garden":"Garden","winter":"Winter","silk":"Silk","emerald":"Emerald","caramellatte":"Caramel Latte","cyberpunk":"Cyberpunk","dim":"Dim","halloween":"Halloween"};
    // The CONFIGURED light/dark pair "system" resolves to.
    const systemPair = { light: 'phoenix-light', dark: 'phoenix-dark' };
    const media = window.matchMedia?.('(prefers-color-scheme: dark)') || null;

    let dispatching = false;

    // localStorage can throw wholesale (sandboxed iframes, storage-blocked
    // modes). Guarded here so a throw degrades to non-persistent theming
    // instead of killing init before any listener attaches.
    const LEGACY_KEY = 'phoenix_kit_theme';

    const storage = {
      get() {
        try {
          return localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
        } catch (e) {
          return null;
        }
      },
      set(value) {
        try {
          localStorage.setItem(STORAGE_KEY, value);
        } catch (e) {}
      },
      remove() {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
      }
    };

    function resolve(theme) {
      if (theme !== 'system') return theme;
      return media && media.matches ? systemPair.dark : systemPair.light;
    }

    function toTitle(value) {
      return value
        .split('-')
        .map((s) => s.charAt(0).toUpperCase() + s.slice(1))
        .join(' ');
    }

    // Stamp the theme on the document and mirror it into every picker —
    // labels, dropdown option indicators, and the pair toggle. Does NOT
    // persist or dispatch; that is setTheme's half.
    function apply(theme) {
      const resolved = resolve(theme);

      [document.documentElement, document.body].forEach((el) => {
        if (!el) return;
        el.setAttribute('data-theme', resolved);
        el.style.colorScheme = themeBaseMap[resolved] || 'light';
      });

      document.querySelectorAll('[data-theme-current-label]').forEach((el) => {
        el.textContent = themeLabels[theme] || toTitle(theme);
      });

      document.querySelectorAll('[data-theme-target]').forEach((btn) => {
        const targets = (btn.dataset.themeTarget || '')
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);
        const isActive = targets.includes(theme) || targets.includes(resolved);

        if (btn.dataset.themeRole === 'toggle') {
          // The persistent pair toggle: aria-pressed = dark half on, and
          // data-phx-theme always points at the OTHER theme — it is what
          // the button's JS.dispatch carries, so the click needs no
          // state of its own. Icon visibility is CSS (keyed off
          // html[data-theme], rendered next to the button), correct from
          // the first paint with no JS involved.
          const isDark = resolved === btn.dataset.themeDark;
          btn.setAttribute('aria-pressed', String(isDark));
          btn.dataset.phxTheme = isDark ? btn.dataset.themeLight : btn.dataset.themeDark;
        } else if (btn.dataset.themeRole === 'dropdown-option') {
          btn.classList.toggle('bg-base-200', isActive);
          btn.classList.toggle('ring-2', isActive);
          btn.classList.toggle('ring-primary/70', isActive);
          btn.setAttribute('aria-selected', String(isActive));
          btn.querySelectorAll('[data-theme-active-indicator]').forEach((icon) => {
            icon.classList.toggle('opacity-100', isActive);
            icon.classList.toggle('scale-100', isActive);
            icon.classList.toggle('scale-75', !isActive);
          });
        }
      });
    }

    // announce=false when the change arrived as a window event: it
    // already bubbled past every host listener, and re-dispatching made
    // hosts hear each selection twice.
    function setTheme(theme, announce) {
      apply(theme);

      if (theme === 'system') {
        storage.remove();
      } else {
        storage.set(theme);
      }

      if (announce && !dispatching) {
        dispatching = true;
        try {
          window.dispatchEvent(new CustomEvent('phx:set-theme', { detail: { theme } }));
        } catch (error) {
          console.warn('PhoenixKit theme controller: unable to dispatch phx:set-theme', error);
        } finally {
          dispatching = false;
        }
      }
    }

    function init() {
      // apply, not setTheme: initialization reflects the saved choice
      // into the UI but should neither rewrite storage nor announce a
      // change nobody made.
      apply(storage.get() || 'system');

      // Follow the OS while in system mode.
      media?.addEventListener('change', () => {
        if ((storage.get() || 'system') === 'system') apply('system');
      });

      // A theme picked in another tab: ThemeBootstrap already restamps
      // the attribute pre-paint on fresh loads; this keeps LIVE pages'
      // pickers in sync too. apply, not setTheme — the other tab
      // already persisted.
      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) apply(e.newValue || 'system');
      });

      // LiveView patches rebuild picker markup mid-session, wiping the
      // client-written state (aria-pressed, data-phx-theme, icon
      // visibility) back to its SSR defaults. Re-stamp after every
      // completed navigation/patch.
      window.addEventListener('phx:page-loading-stop', () => apply(storage.get() || 'system'));

      // Theme selections: every picker element (dropdown options and the
      // pair toggle alike) dispatches phx:set-theme itself via
      // JS.dispatch, carrying the theme in detail or data-phx-theme.
      // Skip our own re-dispatches — see the guard in setTheme.
      window.addEventListener('phx:set-theme', (e) => {
        const theme = e?.detail?.theme ?? e?.target?.dataset?.phxTheme;
        if (theme && !dispatching) setTheme(theme, false);
      });

      // Legacy event name — nothing in the kit emits it anymore, kept
      // only so hosts that adopted it keep working. Announced, so host
      // listeners for the modern event still hear the change.
      document.addEventListener('phx:set-admin-theme', (e) => {
        if (e?.detail?.theme) setTheme(e.detail.theme, true);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
